<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoldHEN Host (CSSFontFace)</title>
  <link rel="stylesheet" href="includes/style.css">
  <script>
    // ============================================================
    // Bootstrap: build version + stale AppCache guard
    // ============================================================
    window.HOST_VERSION = "2026.08.15-r5";

    (function () {
      var key = "hostVersion";
      var cur = null;
      try { cur = localStorage.getItem(key); } catch (e) {}

      if (cur !== null && cur !== window.HOST_VERSION) {
        // Cached page is older than this build -> try to swap & reload once
        try { localStorage.setItem(key, window.HOST_VERSION); } catch (e) {}
        try {
          if (window.applicationCache && applicationCache.status === applicationCache.UPDATEREADY) {
            try { applicationCache.swapCache(); } catch (e2) {}
          }
        } catch (e3) {}
        var reloaded = false;
        try { reloaded = sessionStorage.getItem("hvReloaded") === "1"; } catch (e4) {}
        if (!reloaded) {
          try { sessionStorage.setItem("hvReloaded", "1"); } catch (e5) {}
          window.location.reload();
        }
      } else {
        try { localStorage.setItem(key, window.HOST_VERSION); } catch (e6) {}
      }
    })();
  </script>
</head>
<body>
  <div class="container">

    <header>
      <div class="brand">
        <span class="shape sq">□</span><span class="shape tr">△</span><span class="shape cr">○</span><span class="shape xs">✕</span>
      </div>
      <h1>GAMESPOT <span class="accent">Host</span></h1>
      <div class="sub-brand">CSSFontFace Exploit · PS4 6.00 – 11.02</div>
      <div class="pill-row" id="pill-row">
        <span class="pill" id="fw-pill">System: detecting…</span>
        <span class="pill" id="chain-pill">Chain: —</span>
        <span class="pill" id="attempt-pill">Attempt: 1/3</span>
      </div>
    </header>

    <div class="card">

      <button id="goldhen-btn" class="jb-btn">
        <span class="btn-main">▶ Activate GoldHEN</span>
        <span class="btn-sub">اضغط للتفعيل بضغطة واحدة</span>
      </button>

      <div class="phase-row" id="phase-row">
        <span class="phase" id="phase-webkit">WebKit</span>
        <span class="phase" id="phase-kernel">Kernel</span>
        <span class="phase" id="phase-payload">GoldHEN</span>
      </div>

      <div id="status-msg" class="status idle">Ready — جاهز. اضغط الزر أو انتظر العدّاد.</div>

      <div class="opts">
        <label class="opt">
          <input type="checkbox" id="autoJbInput" checked>
          <span>Auto / تلقائي</span>
        </label>
        <label class="opt">
          <input type="checkbox" id="autoChainInput" checked>
          <span>Auto chain / سلسلة تلقائية</span>
        </label>
        <span class="opt-sep"></span>
        <label class="opt radio">
          <input type="radio" name="kernel" id="lapse-exploit" value="lapse">
          <span>Lapse</span>
        </label>
        <label class="opt radio">
          <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl">
          <span>NetCtrl</span>
        </label>
      </div>

      <pre id="console">Ready. Awaiting execution...&#10;</pre>

    </div>

    <footer>
      CSSFontFace UAF · FW 6.00 – 11.02 · build <span class="ver" id="ver-tag">v—</span>
    </footer>
  </div>

  <script src="src/main.js"></script>
  <script src="includes/script.js"></script>
</body>
</html>
